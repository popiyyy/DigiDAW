# Listener standar MQTT (port 1883) untuk ESP32 & Node-RED
listener 1883
allow_anonymous true

# Listener MQTT over WebSockets (port 9001) untuk browser / Web Digital Twin
listener 9001
protocol websockets
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
